name: main

on:
  pull_request:
    branches: 
      - '**'  # This will trigger the workflow for pull requests on any branch
  push:
    branches:
      - 'main'  # This will trigger the workflow for pushes (merges) to the main branch
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Version tags (e.g. 1.2.0) trigger the publish job

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PowerShell 7
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install PowerShell 7
        run: |
          winget install --id Microsoft.Powershell --source winget --accept-package-agreements --accept-source-agreements
        shell: cmd

      - name: Test Module Manifest
        run: Test-ModuleManifest -Path .\AcuInstallerHelper\AcuInstallerHelper.psd1
        shell: pwsh

      - name: Run Tests
        run: .\RunTests.ps1 -OutputFormat CI
        shell: pwsh

  publish:
    if: startsWith(github.ref, 'refs/tags/') # This job only runs for version tag pushes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build module
        run: dotnet build src/AcumaticaInstallerHelper.CLI/AcumaticaInstallerHelper.CLI.csproj -c Release
        shell: pwsh

      - name: Publish to PowerShell Gallery
        env:
          NUGET_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: |
          $version = (Import-PowerShellDataFile .\AcuInstallerHelper\AcuInstallerHelper.psd1).ModuleVersion
          if (Find-Module AcuInstallerHelper -RequiredVersion $version -ErrorAction SilentlyContinue) {
            Write-Host "Version $version is already on PowerShell Gallery; skipping publish."
            exit 0
          }
          Publish-Module -Path AcuInstallerHelper -NuGetApiKey $env:NUGET_API_KEY -Verbose
        shell: pwsh
